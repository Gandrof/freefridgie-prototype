<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>FreeFridgie · прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Токени з Figma (foundations, напрям A). Світла і темна теми. */
:root{
  --bg:#F4F8F5;--surface:#FFFFFF;--shelf:#E3EFE8;
  --p600:#1B7F55;--p700:#166B47;--p100:#DDF3E8;--phover:#176F4A;--ppressed:#135C3D;--onp:#FFFFFF;
  --s700:#2A6496;--s100:#DCEBF7;
  --n900:#16241D;--n600:#4A5B52;--n300:#C4D1CA;--border:#76877E;
  --success:#166534;--successbg:#DCF5E4;--warning:#9A4A06;--warningbg:#FDEBD3;--error:#B42318;--errorbg:#FBE0E0;--info:#0369A1;--infobg:#DCEEF9;
  --focus:#1B4FD1;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --r-sm:8px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow:0 4px 16px rgba(0,0,0,.10);
}
html[data-theme="dark"]{
  --bg:#0F1A15;--surface:#18271F;--shelf:#1F3329;
  --p600:#4FC48D;--p700:#4FC48D;--p100:#1D3A2D;--phover:#6FD4A2;--ppressed:#8EE0B8;--onp:#07130D;
  --s700:#7DB8E8;--s100:#1B2F40;
  --n900:#E8F1EC;--n600:#A9BAB0;--n300:#3B4D43;--border:#6F8579;
  --success:#5BD38A;--successbg:#173A27;--warning:#F2A04D;--warningbg:#42290F;--error:#FF8A80;--errorbg:#4A1E1E;--info:#6DB8EA;--infobg:#143247;
  --focus:#9DB8FF;--shadow:0 4px 16px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:24px;color:var(--n900);background:#cfd8d2;display:flex;align-items:center;justify-content:center}
html[data-theme="dark"] body{background:#050a07}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
#app{position:relative;width:min(100vw,390px);height:min(100dvh,844px);background:var(--bg);overflow:hidden;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.25);display:flex;flex-direction:column}
@media (max-width:480px){#app{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* типографіка */
.h1{font-size:32px;line-height:40px;font-weight:800}.h2{font-size:26px;line-height:32px;font-weight:800}.h3{font-size:22px;line-height:28px;font-weight:700}.h4{font-size:18px;line-height:24px;font-weight:700}
.body-s{font-size:14px;line-height:20px;font-weight:500}.cap{font-size:12px;line-height:16px;font-weight:600}
.muted{color:var(--n600)}
/* екрани */
.screen{flex:1;min-height:0;display:flex;flex-direction:column;animation:enter .25s ease-out both}
.screen.back{animation-name:enterBack}
@keyframes enter{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes enterBack{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:var(--s2) var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.pad{padding:var(--s5) var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s4);flex:1;min-height:0;overflow-y:auto}
.grow{flex:1}
.row{display:flex;align-items:center;gap:var(--s2)}
.between{justify-content:space-between}
/* кнопки */
.btn{min-height:48px;padding:0 var(--s5);border-radius:var(--r-pill);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);transition:background .15s,transform .15s,box-shadow .15s;width:100%}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--p600);color:var(--onp)}
.btn.primary:hover:not(:disabled){background:var(--phover)}.btn.primary:active:not(:disabled){background:var(--ppressed)}
.btn.secondary{background:var(--p100);color:var(--p700)}
.btn.secondary:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--p600)}.btn.secondary:active:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--p700)}
.btn.text{color:var(--p700)}
.btn.text:hover:not(:disabled){background:var(--p100)}.btn.text:active:not(:disabled){background:var(--n300)}
.btn.danger{background:var(--errorbg);color:var(--error)}
.btn:disabled{background:var(--n300);color:var(--n600);cursor:not-allowed}
.btn.text:disabled{background:none}
.btn.inline{width:auto}
.btn.loading{pointer-events:none}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ibtn{width:44px;height:44px;border-radius:var(--r-md);background:var(--p100);display:grid;place-items:center;color:var(--p700);transition:transform .15s,box-shadow .15s,background .15s}
.ibtn:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--p600)}.ibtn:active:not(:disabled){background:var(--n300);transform:scale(.95)}
.ibtn:disabled{background:var(--n300);color:var(--n600);cursor:not-allowed}
.ibtn.active{background:var(--p600);color:var(--onp)}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* чіпи та бейджі */
.chip{min-height:36px;padding:0 var(--s4);border-radius:var(--r-pill);background:var(--p100);font-size:14px;font-weight:500;display:inline-flex;align-items:center;transition:background .15s}
.chip:hover:not(.active){box-shadow:inset 0 0 0 1.5px var(--p600)}
.chip.active{background:var(--p600);color:var(--onp)}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:var(--s1);padding:2px 6px;border-radius:var(--r-pill);font-size:12px;line-height:16px;font-weight:600;white-space:nowrap}
.badge svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.badge.fresh{color:var(--success);background:var(--successbg)}.badge.soon{color:var(--warning);background:var(--warningbg)}
.badge.today{color:var(--warning);background:var(--warningbg);box-shadow:inset 0 0 0 1.5px var(--warning)}
.badge.expired{color:var(--error);background:var(--errorbg)}
/* верхня панель, нижня панель */
.topbar{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);min-height:64px}
.tabbar{display:flex;align-items:center;justify-content:space-between;padding:0 var(--s6);height:72px;background:var(--surface);flex:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--n600);padding:var(--s1) var(--s3);border-radius:var(--r-md);min-width:64px}
.tab .cap{font-size:12px}
.tab:hover{background:var(--p100)}
.fab{width:56px;height:56px;border-radius:50%;background:var(--p600);color:var(--onp);display:grid;place-items:center;transition:transform .15s,background .15s}
.fab:hover{background:var(--phover)}.fab:active{background:var(--ppressed);transform:scale(.95)}
.fab svg.ic{width:28px;height:28px}
/* полиці та слоти */
.shelf{background:var(--shelf);border-radius:var(--r-md);padding:var(--s3) var(--s1)}
.shelf .zone{padding:0 var(--s2) var(--s2);color:var(--n600)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s1)}
.slot{min-height:96px;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:var(--s1);background:var(--surface);transition:box-shadow .15s,transform .15s;min-width:0}
.slot.empty{background:none;border:1.5px dashed var(--border);color:var(--p700)}
.slot.empty:hover{background:var(--p100)}
.slot.selected{box-shadow:0 0 0 2px var(--p600);animation:pulse .2s ease-out}
.slot.expiredslot{box-shadow:0 0 0 2px var(--error)}
@keyframes pulse{50%{transform:scale(1.04)}}
.slot .em{font-size:28px;line-height:34px}
.slot .nm{font-size:12px;line-height:16px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 var(--s1)}
/* картки */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .ph{height:96px;background:var(--shelf);position:relative;display:grid;place-items:center;font-size:44px}
.card .ph .badge{position:absolute;left:var(--s2);top:var(--s2)}
.card .tx{padding:var(--s3);display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.card .tx b{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.panel{background:var(--surface);border-radius:var(--r-md);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.panel .t{word-break:break-word}
/* поля */
.field{display:flex;flex-direction:column;gap:var(--s1)}
.field label{font-size:14px;line-height:20px;font-weight:500}
.input{height:48px;border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--surface);padding:0 var(--s4);width:100%;transition:border-color .15s}
.input:focus{outline:none;border:2px solid var(--focus);padding:0 calc(var(--s4) - .5px)}
.input.err{border:2px solid var(--error);padding:0 calc(var(--s4) - .5px)}
.input::placeholder{color:var(--n600)}
.input:disabled{background:var(--n300)}
.emsg{color:var(--error);font-size:12px;line-height:16px;font-weight:600;min-height:16px}
.shake{animation:shake .2s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* видошукач */
.vf{height:340px;border-radius:var(--r-lg);background:#05080F;position:relative;display:grid;place-items:center;color:#fff;text-align:center;padding:var(--s7);overflow:hidden;flex:none}
.vf i{position:absolute;width:40px;height:40px;border:4px solid #fff}
.vf i:nth-child(1){left:32px;top:32px;border-right:0;border-bottom:0}.vf i:nth-child(2){right:32px;top:32px;border-left:0;border-bottom:0}
.vf i:nth-child(3){left:32px;bottom:32px;border-right:0;border-top:0}.vf i:nth-child(4){right:32px;bottom:32px;border-left:0;border-top:0}
.vf.scan::after{content:"";position:absolute;left:36px;right:36px;height:3px;background:var(--p600);box-shadow:0 0 12px var(--p600);animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{from{top:48px}to{top:292px}}
/* оверлеї */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dialog{background:var(--surface);width:100%;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:var(--s5) var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s3);animation:up .25s ease-out both;max-height:90%;overflow:auto}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.dialog .btns{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s2)}
.toast{position:absolute;left:var(--s4);right:var(--s4);bottom:88px;background:var(--n900);color:var(--bg);border-radius:var(--r-md);padding:var(--s3) var(--s4);font-size:14px;line-height:20px;font-weight:600;z-index:30;animation:up .25s ease-out both;box-shadow:var(--shadow)}
.toast.push{top:var(--s3);bottom:auto;display:flex;gap:var(--s3);align-items:flex-start}
.toast.error{background:var(--error);color:#fff}
.dots{display:flex;gap:var(--s2)}.dots i{width:8px;height:8px;border-radius:50%;background:var(--n300)}.dots i.on{background:var(--p600)}
.illus{height:280px;border-radius:var(--r-lg);background:var(--p100);display:grid;place-items:center;font-size:56px;flex:none}
.empty{text-align:center;color:var(--n600);padding:var(--s5) var(--s4);display:flex;flex-direction:column;gap:var(--s3);align-items:center}
.empty .em{font-size:48px}
.sel-bar{display:flex;align-items:center;gap:var(--s2);background:var(--surface);border-radius:var(--r-md);padding:var(--s2) var(--s3)}
.sel-bar .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--p100);display:grid;place-items:center;color:var(--p700)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html.still *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
'use strict';
/* ============ дані та допоміжні функції ============ */
const ZONES = [
  {n:'Верхня полиця · готове до вживання', st:'fridge'}, {n:'Середня полиця · щоденне', st:'fridge'},
  {n:'Нижня полиця · овочі', st:'fridge'}, {n:'Дверцята · соуси', st:'fridge'},
  {n:'Морозилка', st:'freezer'}, {n:'Комора', st:'pantry'}
];
const STORAGE_NAMES = {fridge:'Холодильник', freezer:'Морозилка', pantry:'Комора'};
const CATALOG = [
  {name:'Йогурт',barcode:'4820001000011',days:7},{name:'Молоко',barcode:'4820001000028',days:5},{name:'Сир',barcode:'4820001000035',days:14},
  {name:'Яйця',barcode:'4820001000042',days:20},{name:'Сметана',barcode:'4820001000059',days:10},{name:'Курка',barcode:'4820001000066',days:3},
  {name:'Яблука',barcode:'4820001000073',days:12},{name:'Хліб',barcode:'4820001000080',days:4}
];
const EMOJI = [['молок','🥛'],['вершк','🥛'],['сир','🧀'],['яйц','🥚'],['томат','🍅'],['салат','🥬'],['кетчуп','🧴'],['кур','🍗'],['яблук','🍎'],['хліб','🍞'],['йогурт','🥣'],['сметан','🥄'],['макарон','🍝'],['масл','🧈'],['огірк','🥒'],['морк','🥕'],['риб','🐟'],['м\'яс','🥩'],['борошн','🌾'],['цибул','🧅']];
const RECIPES = [
  {n:'Омлет з томатами', ing:['яйц','томат','сир']}, {n:'Макарони з сиром', ing:['макарон','сир','вершк']},
  {n:'Салат з овочів', ing:['томат','огірк','салат','сметан']}, {n:'Сирники', ing:['сир','яйц','борошн']},
  {n:'Курка з овочами', ing:['кур','морк','цибул']}, {n:'Яблучний пиріг', ing:['яблук','яйц','борошн','цукор']}
];
const ING_LABEL = {яйц:'яйця',томат:'томати',сир:'сир',макарон:'макарони',вершк:'вершки',огірк:'огірки',салат:'салат',сметан:'сметана',борошн:'борошно',кур:'курка',морк:'морква',цибул:'цибуля',яблук:'яблука',цукор:'цукор'};
const TIPS = ['Овочі та фрукти мають займати половину тарілки.','Пийте воду регулярно: склянка води перед їжею допомагає не переїдати.','Білок у кожному прийомі їжі (яйця, сир, курка) довше дає ситість.','Заморожуйте продукти до закінчення терміну, щоб не викидати їжу.'];
const ICONS = {
  plus:'M12 5v14M5 12h14', camera:'M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z',
  bulb:'M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z',
  user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20c0-4 4-6 8-6s8 2 8 6', sliders:'M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4',
  up:'M12 19V5M6 11l6-6 6 6', down:'M12 5v14M6 13l6 6 6-6', grid:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',
  list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01', check:'M5 12l5 5L20 7', close:'M6 6l12 12M18 6L6 18',
  clock:'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z', alert:'M12 8v5M12 17h.01M12 3l10 18H2z', back:'M15 5l-7 7 7 7'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const addDays = n => { const d = startOfDay(new Date()); d.setDate(d.getDate()+n); return iso(d); };
const daysLeft = e => Math.round((startOfDay(new Date(e+'T00:00:00')) - startOfDay(new Date())) / 86400000);
const fmtDate = e => { const [y,m,d] = e.split('-'); return `${d}.${m}.${y}`; };
function parseDate(s) {
  const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s.trim()); if (!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3]; if (y < 2000 || y > 2100) return null;
  const dt = new Date(y, mo-1, d); if (dt.getFullYear() !== y || dt.getMonth() !== mo-1 || dt.getDate() !== d) return null;
  return `${y}-${pad2(mo)}-${pad2(d)}`;
}
const statusOf = e => { const d = daysLeft(e); return d < 0 ? 'expired' : d === 0 ? 'today' : d <= 3 ? 'soon' : 'fresh'; };
const STATUS = {fresh:['Свіжий','check'], soon:['Скоро','clock'], today:['Сьогодні','alert'], expired:['Прострочено','close']};
const badge = e => { const s = statusOf(e); return `<span class="badge ${s}">${ic2(STATUS[s][1])}${STATUS[s][0]}</span>`; };
const ic2 = n => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
function daysText(e) {
  const d = daysLeft(e), w = n => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? 'днів' : b === 1 ? 'день' : b >= 2 && b <= 4 ? 'дні' : 'днів'; };
  return d < 0 ? `прострочено на ${-d} ${w(-d)}` : d === 0 ? 'сьогодні останній день' : `ще ${d} ${w(d)}`;
}
const emojiFor = n => { const l = n.toLowerCase(); const f = EMOJI.find(([k]) => l.includes(k)); return f ? f[1] : '🍽️'; };
const uid = () => Math.random().toString(36).slice(2, 9);

/* ============ стан ============ */
const KEY = 'freefridgie-proto-v1';
function seed() {
  const P = (name, zone, slot, days) => ({id:uid(), name, zone, slot, exp:addDays(days)});
  return { onboarded:false, view:'shelves', filter:'all', selected:null, dismissed:[], tip:0,
    settings:{theme:'auto', remind:2, demo:'ok'},
    products:[P('Молоко',0,0,2),P('Сир',0,1,6),P('Йогурт',0,2,0),P('Яйця',1,0,10),P('Томати',1,1,2),P('Салат',2,0,-1),P('Кетчуп',3,0,90),P('Курка',4,0,30)] };
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.products) && s.settings) return s; } } catch (e) {}
  return seed();
}
let S = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let screen = S.onboarded ? 'home' : 'onboarding', navBack = false, busy = false, dialog = null, draft = null, camera = {state:'idle', chips:false}, toastEl = null, toastT = null;
const prodAt = (z, sl) => S.products.find(p => p.zone === z && p.slot === sl);
const freeSlot = z => [0,1,2].find(sl => !prodAt(z, sl));
const sel = () => S.products.find(p => p.id === S.selected);
function zoneFor(storage) { return ZONES.findIndex((z, i) => z.st === storage && freeSlot(i) !== undefined); }

/* ============ тема ============ */
const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme() { const t = S.settings.theme; document.documentElement.dataset.theme = t === 'auto' ? (mq && mq.matches ? 'dark' : 'light') : t; }

/* ============ повідомлення ============ */
function toast(msg, kind) {
  clearTimeout(toastT); if (toastEl) toastEl.remove();
  toastEl = document.createElement('div'); toastEl.className = 'toast' + (kind ? ' ' + kind : ''); toastEl.setAttribute('role', 'status');
  toastEl.textContent = msg; app.appendChild(toastEl); toastT = setTimeout(() => { toastEl && toastEl.remove(); toastEl = null; }, 2600);
}
function pushToast(title, text) {
  clearTimeout(toastT); if (toastEl) toastEl.remove();
  toastEl = document.createElement('div'); toastEl.className = 'toast push'; toastEl.setAttribute('role', 'status');
  toastEl.innerHTML = `<span style="font-size:24px">🧊</span><div><b>${esc(title)}</b><br><span style="font-weight:500">${esc(text)}</span></div>`;
  app.appendChild(toastEl); toastT = setTimeout(() => { toastEl && toastEl.remove(); toastEl = null; }, 4500);
}
function ask(d) { dialog = d; render(); setTimeout(() => { const b = app.querySelector('.dialog .btn'); b && b.focus(); }, 30); }
const closeDialog = () => { dialog = null; render(); };

/* ============ екрани ============ */
const app = document.getElementById('app');
const btn = (a, label, type = 'primary', extra = '', attrs = '') => `<button class="btn ${type}" data-a="${a}" ${extra} ${attrs}>${label}</button>`;
const tabbar = () => `<nav class="tabbar" aria-label="Нижня панель"><button class="tab" data-a="settings">${ic('user')}<span class="cap">Профіль</span></button>

}
function vTop() {

}
function vHome() {
  let body;
  if (!S.products.length) body = `<div class="empty"><div class="em" aria-hidden="true">🧊</div><h2 class="h4">Холодильник порожній</h2><p>Додайте перший продукт: це займе кілька секунд.</p>${btn('add', 'Додати перший продукт', 'primary', '', 'style="width:auto"')}</div>`;
  else if (S.view === 'shelves') body = ZONES.map((z, i) => `<section class="shelf" aria-label="${esc(z.n)}"><div class="zone cap">${esc(z.n)}</div><div class="slots">${[0,1,2].map(sl => slotHtml(i, sl)).join('')}</div></section>`).join('');
  else {

    const chips = [['all','Усі'],['fridge','Холодильник'],['freezer','Морозилка']].map(([k, l]) => `<button class="chip ${f === k ? 'active' : ''}" data-a="filter" data-k="${k}" aria-pressed="${f === k}">${l}</button>`).join('');

  }

function vAdd() {
  const nocam = camera.state === 'nocam', busyc = camera.state === 'busy';
  const snapBtn = busyc ? `<button class="btn primary loading" data-a="snap" aria-busy="true"><span class="spin"></span>Розпізнаємо…</button>` : `<button class="btn primary" data-a="snap" ${nocam ? 'disabled' : ''}>Сфотографувати</button>`;
  return `${header('Додати продукт')}<div class="pad" style="padding-top:var(--s2)">
  <div class="vf ${busyc ? 'scan' : ''}"><i></i><i></i><i></i><i></i><span>${nocam ? 'Камера недоступна.<br>Дозвольте доступ у налаштуваннях<br>або додайте вручну.' : 'Наведіть на штрихкод<br>або дату придатності'}</span></div>
  <div class="chips"><span class="chip ${camera.chips ? 'active' : ''}">✓ Штрихкод</span><span class="chip ${camera.chips ? 'active' : ''}">✓ Дата</span></div>

const errOf = (k) => draft.touched[k] ? (draft.err[k] || '') : '';
function formFields(prefillTitle) {
  return `<div class="field"><label for="f-name">Назва продукту</label><input id="f-name" class="input ${errOf('name') ? 'err' : ''}" data-f="name" maxlength="60" autocomplete="off" placeholder="Наприклад, молоко" value="${esc(draft.name)}" aria-describedby="e-name"><div class="emsg" id="e-name" role="alert">${errOf('name') ? '! ' + errOf('name') : ''}</div></div>
  ${draft.barcode !== undefined ? `<div class="field"><label for="f-bar">Штрихкод</label><input id="f-bar" class="input" data-f="barcode" inputmode="numeric" maxlength="13" autocomplete="off" value="${esc(draft.barcode)}"></div>` : ''}
  <div class="field"><label for="f-date">Термін придатності</label><input id="f-date" class="input ${errOf('date') ? 'err' : ''}" data-f="date" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="ДД.ММ.РРРР" value="${esc(draft.date)}" aria-describedby="e-date"><div class="emsg" id="e-date" role="alert">${errOf('date') ? '! ' + errOf('date') : ''}</div></div>`;
}
function validate() {
  const e = {}; const n = draft.name.trim();
  if (!n) e.name = 'Введіть назву продукту'; else if (n.length > 40) e.name = 'Назва має бути до 40 символів';
  if (!parseDate(draft.date)) e.date = 'Введіть дату у форматі ДД.ММ.РРРР'; draft.err = e; return !Object.keys(e).length;
}
function dateNote() { const d = parseDate(draft.date); return d && daysLeft(d) < 0 ? `<p class="body-s" style="color:var(--error)" id="d-note">Термін уже минув: продукт буде позначено «Прострочено».</p>` : '<span id="d-note"></span>'; }
function vResult() {
  validate();
  return `${header('Перевірте дані')}<div class="pad" style="padding-top:var(--s2)"><p class="body-s muted">Ми розпізнали продукт із фото. Якщо щось не так, виправте.</p>
  <div><span class="badge ${draft.err.date ? 'expired' : 'fresh'}">${ic2('check')}${draft.err.date ? 'Перевірте дату' : 'Розпізнано'}</span></div>${formFields()}<span id="d-note">${dateNote()}</span><div class="grow"></div>
  <button class="btn primary" data-a="confirm" id="b-save" ${Object.keys(draft.err).length ? 'disabled' : ''}>Підтвердити</button>${btn('manual-from', 'Виправити вручну', 'secondary')}</div>`;
}
function vManual() {
  validate();
  const chips = Object.entries(STORAGE_NAMES).map(([k, l]) => `<button class="chip ${draft.storage === k ? 'active' : ''}" data-a="storage" data-k="${k}" aria-pressed="${draft.storage === k}">${l}</button>`).join('');
  const zl = draft.zone !== null ? `<p class="body-s muted">Місце: ${esc(ZONES[draft.zone].n)}</p>` : '';
  return `${header('Додати вручну')}<div class="pad" style="padding-top:var(--s2)">${formFields()}<span id="d-note">${dateNote()}</span>
  <div class="field"><span class="body-s" style="font-weight:500">Де зберігати</span><div class="chips">${chips}</div>${zl}</div><div class="grow"></div>
  <button class="btn primary" data-a="save-manual" id="b-save" ${Object.keys(draft.err).length ? 'disabled' : ''}>Зберегти</button>${btn('back', 'Скасувати', 'text')}</div>`;
}
function adviceList() {
  const out = [];
  S.products.forEach(p => {
    const st = statusOf(p.exp), z = ZONES[p.zone];
    if (st === 'expired') out.push({key:'rm:' + p.id, t:`${p.name} прострочено: приберіть його й звільніть місце.`, a:'Прибрати', act:'adv-rm', id:p.id});
    else if ((st === 'soon' || st === 'today') && z.st === 'fridge' && p.zone !== 0) out.push({key:'mv:' + p.id, t:`${p.name} швидко псується: перенесіть на верхню полицю, щоб побачити першим.`, a:'Прийняти', act:'adv-mv', id:p.id});
  });
  return out.filter(x => !S.dismissed.includes(x.key));
}
function recipes() {
  const alive = S.products.filter(p => statusOf(p.exp) !== 'expired').map(p => p.name.toLowerCase());
  return RECIPES.map(r => { const have = r.ing.filter(k => alive.some(n => n.includes(k))), miss = r.ing.filter(k => !have.includes(k)); return {n:r.n, have, miss}; })
    .filter(r => r.have.length >= 1 && r.miss.length <= 2).sort((a, b) => a.miss.length - b.miss.length);
}
function vAdvice() {
  const adv = adviceList(), rec = recipes(), L = a => a.map(k => ING_LABEL[k]).join(', ');
  return `${header('Поради')}<div class="scroll"><h2 class="h4">Що посунути</h2>
  ${adv.length ? adv.map(x => `<div class="panel"><p class="body-s t">${esc(x.t)}</p><div class="row"><button class="btn secondary inline" data-a="${x.act}" data-id="${x.id}">${x.a}</button><button class="btn text inline" data-a="decline" data-k="${esc(x.key)}">Відхилити</button></div></div>`).join('') : `<div class="empty"><div class="em">✅</div><p>Усе на своїх місцях: порад щодо полиць немає.</p></div>`}
  <h2 class="h4">Що приготувати</h2>
  ${rec.length ? rec.map(r => `<div class="panel"><b class="h4">${esc(r.n)}</b><p class="body-s muted">Є: ${L(r.have)}${r.miss.length ? ' · бракує: ' + L(r.miss) : ' · все є'}</p></div>`).join('') : `<div class="empty"><div class="em">🍳</div><p>Поки не вистачає продуктів для підказок. Додайте ще кілька.</p></div>`}
  <h2 class="h4">Порада дня</h2><div class="panel"><p class="body-s">${esc(TIPS[S.tip % TIPS.length])}</p></div></div>`;
}
function vSettings() {
  const ch = (k, items, cur) => `<div class="chips">${items.map(([v, l]) => `<button class="chip ${String(cur) === String(v) ? 'active' : ''}" data-a="${k}" data-v="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`;
  const s = S.settings;
  return `${header('Профіль і налаштування')}<div class="scroll"><div class="row" style="gap:var(--s3);padding:var(--s2) 0"><div class="avatar">${ic('user')}</div><div><b class="h4">Студент</b><div class="body-s muted">Гість · без акаунта</div></div></div>
  <div class="panel"><b>Нагадування про термін</b>${ch('remind', [[2,'За 2 дні'],[1,'За 1 день'],[0,'Вимкнено']], s.remind)}</div>
  <div class="panel"><b>Тема</b>${ch('theme', [['light','Світла'],['dark','Темна'],['auto','Авто']], s.theme)}</div>
  <div class="panel"><b>Мова</b><span class="body-s muted">Українська</span></div>
  <div class="panel"><b>Демо: розпізнавання фото</b><span class="body-s muted">Для перевірки гілок помилок.</span>${ch('demo', [['ok','Успіх'],['fail','Збій'],['nocam','Без камери'],['random','Випадково']], s.demo)}</div>
  <button class="btn secondary" data-a="push">Показати тестове push-сповіщення</button>
  <button class="btn danger" data-a="reset">Скинути дані прототипу</button></div>`;
}
function vDialog() {
  if (!dialog) return '';
  return `<div class="overlay" data-a="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h2 class="h3" id="dlg-t">${dialog.title}</h2>${dialog.body || ''}
  <div class="btns">${dialog.actions.map(a => `<button class="btn ${a.type || 'primary'}" data-a="${a.a}" ${a.id ? `data-id="${a.id}"` : ''}>${a.label}</button>`).join('')}</div></div></div>`;
}
function render() {
  const v = {onboarding:vOnboarding, home:vHome, add:vAdd, result:vResult, manual:vManual, advice:vAdvice, settings:vSettings}[screen];
  const keep = toastEl;
  app.innerHTML = `<main class="screen ${navBack ? 'back' : ''}" id="screen">${v()}</main>${vDialog()}`; navBack = false;
  if (keep && toastEl) app.appendChild(toastEl);
}
const patchForm = () => {
  const b = document.getElementById('b-save'); if (b) b.disabled = Object.keys(draft.err).length > 0;
  ['name','date'].forEach(k => { const m = document.getElementById('e-' + k), i = document.querySelector(`[data-f="${k}"]`); if (m) m.textContent = errOf(k) ? '! ' + errOf(k) : ''; if (i) i.classList.toggle('err', !!errOf(k)); });
  const n = document.getElementById('d-note'); if (n) n.innerHTML = dateNote();
};

/* ============ навігація ============ */
function go(s, back) { screen = s; navBack = !!back; dialog = null; render(); const m = document.getElementById('screen'); m && m.focus && m.setAttribute('tabindex', '-1'); }
function newDraft(o = {}) { draft = Object.assign({name:'', date:'', storage:'fridge', zone:null, touched:{}, err:{}}, o); }
function addProduct(name, expIso, zone) {
  let z = zone, storage;
  if (z === null || z === undefined || freeSlot(z) === undefined) { storage = z !== null && z !== undefined ? ZONES[z].st : draft.storage; z = zoneFor(storage); }
  if (z < 0) { ask({title:'Місця немає', body:`<p class="muted">Усі слоти розділу «${STORAGE_NAMES[storage || draft.storage]}» заповнені. Видаліть продукт або оберіть інше місце зберігання.</p>`, actions:[{label:'Зрозуміло', a:'close'}]}); return false; }
  const p = {id:uid(), name:name.trim().slice(0, 40), zone:z, slot:freeSlot(z), exp:expIso};
  S.products.push(p); S.selected = p.id; save(); return true;
}
function move(dir) {
  const p = sel(); if (!p) return;
  for (let z = p.zone + dir; z >= 0 && z < ZONES.length; z += dir) { const fs = freeSlot(z); if (fs !== undefined) { p.zone = z; p.slot = fs; save(); render(); return; } }
  toast(dir < 0 ? 'Вище немає вільного місця' : 'Нижче немає вільного місця', 'error');
}
function snap() {
  if (busy) return; const mode = S.settings.demo;
  if (mode === 'nocam') { camera.state = 'nocam'; render(); return; }
  busy = true; camera.state = 'busy'; render();
  setTimeout(() => {
    busy = false; const ok = mode === 'ok' || (mode === 'random' && Math.random() > .3);
    if (screen !== 'add') { camera.state = 'idle'; return; }
    if (ok) {
      const it = CATALOG[Math.floor(Math.random() * CATALOG.length)];
      camera = {state:'idle', chips:true}; newDraft({name:it.name, barcode:it.barcode, date:fmtDate(addDays(it.days)), touched:{name:true, date:true}}); go('result');
    } else {
      camera = {state:'idle', chips:false}; render();
      ask({title:'Не вдалося розпізнати', body:'<p class="muted">Спробуйте сфотографувати ближче й при кращому світлі або додайте продукт вручну.</p>', actions:[{label:'Спробувати ще', a:'retry'},{label:'Додати вручну', a:'manual', type:'secondary'}]});
    }
  }, 1300);
}
function details(id) {
  const p = S.products.find(x => x.id === id); if (!p) return;
  ask({title:`${emojiFor(p.name)} ${esc(p.name)}`, body:`<div class="row" style="flex-wrap:wrap">${badge(p.exp)}<span class="body-s muted">${daysText(p.exp)}</span></div>
  <p class="body-s">Термін придатності: <b>${fmtDate(p.exp)}</b></p><p class="body-s muted">${esc(ZONES[p.zone].n)}</p>`,
    actions:[{label:'Закрити', a:'close', type:'secondary'},{label:'Видалити', a:'del', id:p.id, type:'danger'}]});
}
function confirmDel(id) {
  const p = S.products.find(x => x.id === id); if (!p) return;
  ask({title:'Видалити продукт?', body:`<p class="muted">«${esc(p.name)}» буде прибрано з холодильника.</p>`, actions:[{label:'Видалити', a:'del-yes', id, type:'danger'},{label:'Скасувати', a:'close', type:'text'}]});
}

/* ============ обробники ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t || t.disabled) return;
  const a = t.dataset.a, d = t.dataset;
  if (a === 'overlay') { if (e.target === t) closeDialog(); return; }
  if (busy && a !== 'snap') return;
  switch (a) {
    case 'start': S.onboarded = true; save(); go('home'); break;
    case 'login': ask({title:'Акаунти поки недоступні', body:'<p class="muted">У прототипі вхід не реалізовано. Продовжіть як гість.</p>', actions:[{label:'Продовжити як гість', a:'start'}]}); break;
    case 'view': S.view = S.view === 'shelves' ? 'cards' : 'shelves'; S.selected = null; save(); render(); break;
    case 'filter': S.filter = d.k; save(); render(); break;
    case 'up': move(-1); break; case 'down': move(1); break;
    case 'pick': S.selected = S.selected === d.id ? null : d.id; render(); break;
    case 'empty': {
      const p = sel(), z = +d.z;
      if (p) { p.zone = z; p.slot = freeSlot(z); save(); render(); toast('Продукт переміщено'); }
      else { newDraft({zone:z, storage:ZONES[z].st}); go('manual'); }
      break; }
    case 'add': camera = {state:'idle', chips:false}; go('add'); break;
    case 'snap': snap(); break;
    case 'retry': dialog = null; render(); snap(); break;
    case 'manual': newDraft(); go('manual'); break;
    case 'manual-from': { const keep = {name:draft.name, date:draft.date}; newDraft(keep); go('manual'); break; }
    case 'storage': draft.storage = d.k; draft.zone = null; render(); break;
    case 'confirm': case 'save-manual': {
      draft.touched = {name:true, date:true};
      if (!validate()) { patchForm(); app.querySelectorAll('.input.err').forEach(i => { i.classList.remove('shake'); void i.offsetWidth; i.classList.add('shake'); }); break; }
      if (addProduct(draft.name, parseDate(draft.date), draft.zone)) { go('home'); toast('Продукт додано'); }
      break; }
    case 'advice': go('advice'); break;
    case 'settings': go('settings'); break;
    case 'back': navBack = true; if (screen === 'result') go('add', true); else go('home', true); break;
    case 'details': details(d.id); break;
    case 'del': confirmDel(d.id); break;
    case 'del-yes': S.products = S.products.filter(p => p.id !== d.id); if (S.selected === d.id) S.selected = null; save(); dialog = null; render(); toast('Продукт видалено'); break;
    case 'close': closeDialog(); break;
    case 'adv-rm': S.products = S.products.filter(p => p.id !== d.id); save(); render(); toast('Продукт прибрано'); break;
    case 'adv-mv': { const p = S.products.find(x => x.id === d.id); const fs = freeSlot(0); if (p && fs !== undefined) { p.zone = 0; p.slot = fs; save(); render(); toast('Продукт переміщено на верхню полицю'); } else toast('На верхній полиці немає місця', 'error'); break; }
    case 'decline': S.dismissed.push(d.k); S.tip++; save(); render(); break;
    case 'remind': S.settings.remind = +d.v; save(); render(); break;
    case 'theme': S.settings.theme = d.v; save(); applyTheme(); render(); break;
    case 'demo': S.settings.demo = d.v; save(); render(); break;
    case 'push': { const soon = S.products.filter(p => ['soon','today'].includes(statusOf(p.exp))); pushToast('FreeFridgie', soon.length ? `${soon[0].name}: ${daysText(soon[0].exp)}` : 'Усі продукти свіжі'); break; }
    case 'reset': ask({title:'Скинути дані?', body:'<p class="muted">Усі продукти й налаштування повернуться до початкових.</p>', actions:[{label:'Скинути', a:'reset-yes', type:'danger'},{label:'Скасувати', a:'close', type:'text'}]}); break;
    case 'reset-yes': S = seed(); S.onboarded = true; save(); applyTheme(); dialog = null; go('home'); toast('Дані скинуто'); break;
  }
});
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.f; if (!f || !draft) return;
  if (f === 'date') { let v = e.target.value.replace(/\D/g, '').slice(0, 8); if (v.length > 4) v = v.slice(0,2) + '.' + v.slice(2,4) + '.' + v.slice(4); else if (v.length > 2) v = v.slice(0,2) + '.' + v.slice(2); e.target.value = v; }
  draft[f] = e.target.value; if (f === 'name' || f === 'date') draft.touched[f] = draft.touched[f] || false; validate(); patchForm();
});
document.addEventListener('focusout', e => { const f = e.target.dataset && e.target.dataset.f; if (!f || !draft || !['name','date'].includes(f)) return; draft.touched[f] = true; validate(); patchForm(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && dialog) closeDialog();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.f) { const b = document.getElementById('b-save'); if (b && !b.disabled) b.click(); else { draft.touched = {name:true, date:true}; validate(); patchForm(); } }
});
window.addEventListener('storage', () => {});
/* Швидкі посилання для демо та скриншотів: index.html#cards, #add, #result, #manual-error, #advice, #settings, #dark, #selected */
(function demoHash() {
  const h = decodeURIComponent(location.hash.slice(1)); if (!h) return;
  document.documentElement.classList.add('still');
  S = seed(); S.onboarded = true; S.settings.theme = 'light'; screen = 'home';
  const M = S.products.find(p => p.name === 'Молоко');
  switch (h) {
    case 'onboarding': S.onboarded = false; screen = 'onboarding'; break;
    case 'cards': S.view = 'cards'; break;
    case 'selected': S.selected = M.id; break;
    case 'dark': S.settings.theme = 'dark'; break;
    case 'add': camera = {state:'idle', chips:false}; screen = 'add'; break;
    case 'result': camera = {state:'idle', chips:true}; newDraft({name:'Йогурт', barcode:'4820001000011', date:fmtDate(addDays(7)), touched:{name:true, date:true}}); screen = 'result'; break;
    case 'manual-error': newDraft({name:'Молоко', date:'12.13.2026', touched:{name:true, date:true}}); screen = 'manual'; break;
    case 'advice': screen = 'advice'; break;
    case 'settings': screen = 'settings'; break;
    case 'settings-dark': S.settings.theme = 'dark'; screen = 'settings'; break;
  }
})();
applyTheme(); render();
</script>
